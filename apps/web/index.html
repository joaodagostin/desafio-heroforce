<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172725" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved preference before rendering to avoid a light flash on reload.
      (() => {
        let theme = 'light';
        try {
          if (localStorage.getItem('heroforce.theme') === 'dark') theme = 'dark';
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#101a16' : '#f7f8fa';
      })();
    </script>
    <meta
      name="description"
      content="HeroForce — grandes projetos começam com uma equipe de heróis. Organize missões, acompanhe metas e transforme ambição em impacto."
    />
    <title>HeroForce · Central de missões</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
